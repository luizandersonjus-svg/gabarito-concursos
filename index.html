    if (q > a) ofertaErros(it, q - a);
  };
  $("#rMin").focus();
}

let toastT = null;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

// ---------- eventos ----------
document.addEventListener("click", async e => {
  if (e.target.closest("[data-google]")){ entrarGoogle(); return; }
  const au = e.target.closest("[data-auth]");
  if (au){ const em = ($("#aEmail") || {}).value || ""; renderAuth(au.dataset.auth); $("#aEmail").value = em; ($("#aEmail").value ? $("#aSenha") : $("#aEmail")).focus(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, me = S.me;
  if (act === "sair"){ el.disabled = true; try { await S.sb.auth.signOut(); } catch(_){ location.reload(); } return; }
  if (act === "admRecarregar"){ carregarAdmin(); return; }
  if (act === "admSet" || act === "admPapel"){
    const id = el.dataset.id, v = el.dataset.v, nome = el.dataset.nome;
    if (act === "admSet" && v === "aprovado"){ admAlterar(id, { status: "aprovado" }, "Acesso liberado para " + nome + "."); return; }
    const txt = act === "admPapel" ? (v === "admin" ? `Tornar ${nome} administrador? Ele poderá liberar e bloquear outros alunos.` : `Remover ${nome} dos administradores?`) : `Bloquear o acesso de ${nome}? Ele sai do ranking, mas os dados ficam guardados.`;
    if (!(await confirmBox(txt, act === "admPapel" ? "Confirmar" : "Bloquear"))) return;
    if (act === "admPapel") admAlterar(id, { papel: v }, v === "admin" ? nome + " agora é administrador." : nome + " voltou a ser aluno.");
    else admAlterar(id, { status: "bloqueado" }, "Acesso de " + nome + " bloqueado.");
    return;
  }
  if (act === "registrar"){ openRegistro(); return; }
  if (!me) return;
  const m = el.dataset.m ? findMat(el.dataset.m) : null;
  if (act === "toggleMat"){ S.ui.open[el.dataset.m] = !S.ui.open[el.dataset.m]; render(true); return; }
  if (act === "status"){
    const t = findTop(m, el.dataset.t), node = el.dataset.s ? (t.subs||[]).find(s => s.id === el.dataset.s) : t;
    node.status = Number(el.dataset.v); saveMe(); return;
  }
  if (act === "showAddSub"){ S.ui.addSubFor = el.dataset.t; render(true); const i = document.getElementById("addSub-" + el.dataset.t); if (i) i.focus(); return; }
  if (act === "importToggle"){ S.ui.importFor = S.ui.importFor === el.dataset.m ? null : el.dataset.m; render(true); return; }
  if (act === "delSub"){ const t = findTop(m, el.dataset.t); t.subs = (t.subs||[]).filter(s => s.id !== el.dataset.s); saveMe(); return; }
  if (act === "delTop"){
    const t = findTop(m, el.dataset.t);
    if (!(await confirmBox(`Remover o tópico “${t.nome}” e seus subtópicos? Os registros de estudo continuam salvos.`, "Remover"))) return;
    m.topicos = m.topicos.filter(x => x.id !== el.dataset.t); saveMe(); return;
  }
  if (act === "delMat"){
    if (!(await confirmBox(`Excluir a matéria “${m.nome}”? Tópicos e estatísticas dela saem do painel e do ranking.`, "Excluir"))) return;
    me.materias = me.materias.filter(x => x.id !== m.id); saveMe(); return;
  }
  if (act === "renMat"){ const v = await promptBox("Novo nome da matéria", m.nome); if (v){ m.nome = v; saveMe(); } return; }
  if (act === "delReg"){
    if (!(await confirmBox("Apagar este registro? Horas e questões dele saem das estatísticas.", "Apagar"))) return;
    const mk = el.dataset.mk; S.months[mk] = (S.months[mk]||[]).filter(i => i.id !== el.dataset.id); saveMonth(mk); saveMe(); return;
  }
  if (act === "tick"){
    const d = me.cronograma.dias[Number(el.dataset.d)], b = d.blocos.find(x => x.id === el.dataset.b);
    if (b.feito){ b.feito = false; saveMe(); return; }
    openRegistro({ mid: b.mid, tid: b.tid, sid: b.sid, tipo: b.tipo, min: b.min, data: d.data <= today() ? d.data : today(), planDay: Number(el.dataset.d), planBlock: b.id });
    return;
  }
  if (act === "limparCron"){ if (await confirmBox("Apagar o cronograma atual?", "Apagar")){ delete me.cronograma; saveMe(); } return; }
  if (act === "rk"){ S.ui[el.dataset.k] = el.dataset.v; render(true); return; }
  if (act === "fcRevisar"){ sessaoRevisao(el.dataset.m || null); return; }
  if (act === "fcShuffle"){ sessaoEmbaralhada($("#fcShufMat").value, Number($("#fcShufN").value) || 20); return; }
  if (act === "fcNovo"){ openCard({ mid: el.dataset.m }); return; }
  if (act === "fcToggle"){ S.ui.fcOpen[el.dataset.m] = !S.ui.fcOpen[el.dataset.m]; render(true); return; }
  if (act === "fcEdit"){ openCard({ mid: el.dataset.m }, el.dataset.id); return; }
  if (act === "fcDel"){
    if (!(await confirmBox("Apagar este flashcard?", "Apagar"))) return;
    const d = fcDoc(el.dataset.m); d.cards = d.cards.filter(c => c.id !== el.dataset.id); savePriv("fc-" + el.dataset.m); return;
  }
  if (act === "dkPlay"){ praticarBaralho(el.dataset.o, el.dataset.d); return; }
  if (act === "dkCopy"){ copiarBaralho(el.dataset.o, el.dataset.d); return; }
  if (act === "dkSync"){
    const d = (S.decks[S.uid] || {})[el.dataset.d]; if (!d) return;
    if (!findMat(d.mid)){ toast("A matéria de origem deste baralho foi excluída."); return; }
    const prev = { cards: d.cards, em: d.em };
    d.cards = fcDoc(d.mid).cards.slice(0, 400).map(c => ({ id: c.id, f: c.f, v: c.v })); d.em = today();
    if (!cabeDecks()){ Object.assign(d, prev); return; }
    saveDecks(); toast("Baralho atualizado com seus cards atuais."); return;
  }
  if (act === "dkDel"){
    if (!(await confirmBox("Remover este baralho do grupo? Seus cards continuam com você.", "Remover"))) return;
    const mine = S.decks[S.uid] || {}; delete mine[el.dataset.d]; saveDecks(); toast("Baralho removido do grupo."); return;
  }
  if (act === "erNovo"){ openErro({}); return; }
  if (act === "erRevisar"){ sessaoErros(); return; }
  if (["erRev", "erSup", "erFc", "erEdit", "erDel"].includes(act)){
    const mid = el.dataset.m, e2 = erDoc(mid).itens.find(x => x.id === el.dataset.id); if (!e2) return;
    if (act === "erRev"){ e2.revs = (e2.revs || 0) + 1; e2.ultRev = today(); savePriv("er-" + mid); toast("Revisão registrada."); }
    else if (act === "erSup"){ e2.sup = !e2.sup; savePriv("er-" + mid); toast(e2.sup ? "Erro marcado como superado." : "Erro reaberto."); }
    else if (act === "erFc"){
      const fd = fcDoc(mid);
      if (fd.cards.some(c => c.deErro === e2.id)){ toast("Este erro já virou flashcard."); return; }
      fd.cards.push({ id: uid(), f: e2.enun || ("Erro em " + (topicLabel(mid, e2.tid, e2.sid) || m?.nome || "")), v: e2.lembrar || "", tid: e2.tid, sid: e2.sid, criado: today(), deErro: e2.id });
      const cut = ajustaLimite("fc-" + mid, "cards"); savePriv("fc-" + mid); toast(cut ? LIMITE : "Flashcard criado a partir do erro.");
    }
    else if (act === "erEdit"){ openErro({ mid }, e2.id); }
    else if (act === "erDel"){
      if (!(await confirmBox("Apagar este erro do caderno?", "Apagar"))) return;
      const d = erDoc(mid); d.itens = d.itens.filter(x => x.id !== el.dataset.id); savePriv("er-" + mid);
    }
    return;
  }
});
document.addEventListener("keydown", e => {
  const st = S.study;
  if (st && st.i < st.items.length && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    if ((e.key === " " || e.key === "Enter") && !st.shown){ e.preventDefault(); st.shown = true; renderStudy(); return; }
    if (st.shown){ const map = st.mode === "srs" ? { "1": 0, "2": 1, "3": 2, "4": 3 } : { "1": 0, "2": 3 }; if (e.key in map){ e.preventDefault(); gradeStudy(map[e.key]); return; } }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".mat-h")){ e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && $("#modalRoot").innerHTML){ const no = $("#rNo") || $("#pNo") || $("#cNo") || $("#kNo") || $("#eNo") || $("#sClose"); if (no) no.click(); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-sact]"); if (!el || !S.study) return;
  const a = el.dataset.sact, st = S.study;
  if (a === "close"){ S.study = null; closeModal(); if (st.done && st.i < st.items.length) toast(`Sessão encerrada: ${st.done} ${st.mode === "erros" ? "erros revisados" : "cards"}.`); return; }
  if (a === "flip"){ st.shown = true; renderStudy(); return; }
  if (a === "grade"){ gradeStudy(Number(el.dataset.g)); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "peso"){ const m = findMat(el.dataset.m); m.peso = Number(el.value); el.blur(); saveMe(); }
  if (el.dataset.act === "uiSel"){ S.ui[el.dataset.k] = el.value; el.blur(); render(); }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "fAuth"){ e.preventDefault(); entrar(); return; }
  if (f.id === "fOnb"){
    e.preventDefault();
    const nome = $("#onbNome").value.trim(); if (!nome){ $("#onbNome").focus(); return; }
    const materias = $("#onbModelo").checked ? MODELO.map((m, i) => ({ id: uid(), nome: m.nome, cor: CORES[i % CORES.length], peso: m.peso, topicos: m.t.map(n => ({ id: uid(), nome: n, status: 0, subs: [] })) })) : [];
    S.me = { v: 1, apelido: nome.slice(0,40), concurso: $("#onbConc").value.trim().slice(0,80), metaSemanalH: Math.max(1, parseInt($("#onbMeta").value) || 20), dataProva: $("#onbProva").value || "", materias, criadoEm: new Date().toISOString() };
    location.hash = "painel"; S.tab = "painel"; setTab("painel", true);
    saveMe(); render(true); return;
  }
  const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const me = S.me, m = f.dataset.m ? findMat(f.dataset.m) : null;
  if (kind === "addMat"){
    const v = $("#addMat").value.trim(); if (!v) return;
    const id = uid(); me.materias = me.materias || [];
    me.materias.push({ id, nome: v.slice(0,80), cor: CORES[me.materias.length % CORES.length], peso: 3, topicos: [] });
    S.ui.open[id] = true; document.activeElement.blur(); saveMe(); render(true); return;
  }
  if (kind === "addTop"){
    const inp = document.getElementById("addTop-" + m.id), v = inp.value.trim(); if (!v) return;
    m.topicos = m.topicos || []; m.topicos.push({ id: uid(), nome: v.slice(0,120), status: 0, subs: [] });
    saveMe(); render(true); const n = document.getElementById("addTop-" + m.id); if (n) n.focus(); return;
  }
  if (kind === "addSub"){
    const t = findTop(m, f.dataset.t), inp = document.getElementById("addSub-" + t.id), v = inp.value.trim(); if (!v) return;
    t.subs = t.subs || [];
    if (!t.subs.length && t.status){ /* o domínio passa a ser medido pelos subtópicos */ }
    t.subs.push({ id: uid(), nome: v.slice(0,120), status: 0 });
    saveMe(); render(true); const n = document.getElementById("addSub-" + t.id); if (n) n.focus(); return;
  }
  if (kind === "import"){
    const txt = document.getElementById("imp-" + m.id).value;
    let cur = null, nT = 0, nS = 0; m.topicos = m.topicos || [];
    txt.split(/\r?\n/).forEach(raw => {
      if (!raw.trim()) return;
      const isSub = /^\s+|^\s*[-–•*]/.test(raw) && cur;
      const name = raw.replace(/^\s*[-–•*]?\s*(\d+(\.\d+)*[.)]?\s+)?/, "").trim().slice(0,120);
      if (!name) return;
      if (isSub){ cur.subs.push({ id: uid(), nome: name, status: 0 }); nS++; }
      else { cur = { id: uid(), nome: name, status: 0, subs: [] }; m.topicos.push(cur); nT++; }
    });
    S.ui.importFor = null; document.activeElement.blur(); saveMe(); render(true);
    toast(`Importados ${nT} tópicos e ${nS} subtópicos.`); return;
  }
  if (kind === "gerar"){
    const cfg = { horas: WD.map((_, i) => Math.max(0, Math.min(16, parseFloat(document.getElementById("h"+i).value) || 0))), bloco: Number($("#cBloco").value), semanas: Number($("#cSem").value), dataProva: $("#cProva").value || "", revisao: $("#cRev").checked };
    if (!cfg.horas.some(h => h * 60 >= cfg.bloco)){ toast("Informe horas suficientes para pelo menos um bloco em algum dia."); return; }
    me.dataProva = cfg.dataProva;
    me.cronograma = gerarCronograma(cfg);
    document.activeElement.blur(); saveMe(); render(true);
    toast("Cronograma gerado."); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (kind === "bulk"){
    const mid = $("#bulkMat").value, txt = $("#bulkTxt").value, doc = fcDoc(mid); let n = 0;
    txt.split(/\r?\n/).forEach(l => {
      if (!l.trim()) return;
      let i = l.indexOf("\t"), w = 1;
      if (i < 0){ i = l.indexOf("|"); w = 1; }
      if (i < 0){ i = l.indexOf(";"); w = 1; }
      const f = (i < 0 ? l : l.slice(0, i)).trim(), v = i < 0 ? "" : l.slice(i + w).trim();
      if (!f) return;
      doc.cards.push({ id: uid(), f: f.slice(0, 1000), v: v.slice(0, 1000), tid: null, sid: null, criado: today() }); n++;
    });
    if (!n){ toast("Escreva pelo menos um card, com frente | verso."); return; }
    const cut = ajustaLimite("fc-" + mid, "cards");
    S.ui.bulkMat = mid; S.ui.fcOpen[mid] = true;
    document.activeElement.blur(); savePriv("fc-" + mid); render(true);
    toast(cut ? LIMITE : `${n} ${n > 1 ? "cards criados" : "card criado"} em ${findMat(mid)?.nome || ""}.`); return;
  }
  if (kind === "share"){
    const mid = $("#dkMat").value, m = findMat(mid), cards = fcDoc(mid).cards;
    if (!m || !cards.length){ toast("Essa matéria ainda não tem flashcards."); return; }
    const mine = S.decks[S.uid] || (S.decks[S.uid] = {});
    const did = Object.keys(mine).find(k => mine[k].mid === mid) || uid(), prev = mine[did];
    mine[did] = { titulo: ($("#dkTit").value.trim() || prev?.titulo || m.nome).slice(0, 80), materia: m.nome, mkey: norm(m.nome), cor: m.cor, concurso: S.me.concurso || "", ckey: norm(S.me.concurso), mid, cards: cards.slice(0, 400).map(c => ({ id: c.id, f: c.f, v: c.v })), em: today() };
    if (!cabeDecks()){ if (prev) mine[did] = prev; else delete mine[did]; return; }
    document.activeElement.blur(); saveDecks(); render(true);
    toast(prev ? "Baralho atualizado para o grupo." : "Baralho compartilhado com o grupo."); return;
  }
  if (kind === "perfil"){
    const nome = $("#pNome").value.trim(); if (!nome) return;
    me.apelido = nome.slice(0,40); me.concurso = $("#pConc").value.trim().slice(0,80); me.metaSemanalH = Math.max(1, parseInt($("#pMeta").value) || 20);
    document.activeElement.blur(); saveMe(); render(true); toast("Perfil salvo."); return;
  }
});

boot();
})();
