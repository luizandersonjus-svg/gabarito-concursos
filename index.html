<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de estudos para concursos: painel de desempenho, cronograma, flashcards, caderno de erros, curvas de aprendizado e ranking do grupo.">
<meta property="og:title" content="Gabarito Concursos">
<meta property="og:description" content="Estude com método, acompanhe sua evolução e cresça junto com o grupo.">
<meta property="og:type" content="website">
<title>Gabarito Concursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra fixa com abas + coluna única de painéis; o cartão-resposta (bolinhas) marca o domínio de cada tópico */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#132033; --muted:#5A6678; --line:#D9DFE7;
  --accent:#1B7A52; --accent-ink:#FFFFFF; --accent-soft:#E1F0E8;
  --good:#1B7A52; --warn:#B26B12; --bad:#BE3A2E; --chip:#E6EBF1;
  --s1:#1B7A52; --s2:#4C6FD9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){html{color-scheme:dark}:root:not([data-theme="light"]){
  --bg:#0D131C; --surface:#151D29; --sunk:#111823; --ink:#E5EAF1; --muted:#93A0B3; --line:#263244;
  --accent:#3DBE84; --accent-ink:#04140C; --accent-soft:#15322A;
  --good:#3DBE84; --warn:#E3A647; --bad:#F06A5A; --chip:#1E2836; --s1:#2FA872; --s2:#6F86E6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D131C; --surface:#151D29; --sunk:#111823; --ink:#E5EAF1; --muted:#93A0B3; --line:#263244;
  --accent:#3DBE84; --accent-ink:#04140C; --accent-soft:#15322A;
  --good:#3DBE84; --warn:#E3A647; --bad:#F06A5A; --chip:#1E2836; --s1:#2FA872; --s2:#6F86E6; color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.brand .dots{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.brand .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.brand .dots i.f{background:var(--accent);border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;order:3;flex-basis:100%;margin-inline:-12px}
.top .wrap{justify-content:space-between}
nav.tabs a{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--sunk)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--chip)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;color:var(--muted);background:var(--sunk)}

/* Cabeçalho do painel */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.countdown{text-align:right}
.countdown .num{font-size:2rem;font-weight:700;line-height:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi .s{font-size:.82rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ring{display:flex;align-items:center;gap:12px}

/* Tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.bar{position:relative;height:8px;background:var(--chip);border-radius:4px;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--chip);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* Onde melhorar */
.weak{display:flex;flex-direction:column;gap:8px}
.weak li{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:8px}
.weak ul{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.weak .t{min-width:0}
.weak .t b{display:block;font-weight:600}

/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--chip)}

/* Matérias */
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mat-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.mat-h .name{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
.mat-h .name h3{font-size:1.05rem}
.mat-h .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mat-b{border-top:1px solid var(--line);padding:12px 16px 16px;background:var(--sunk)}
.topic{padding:8px 0;border-bottom:1px dashed var(--line)}
.topic:last-child{border-bottom:0}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trow .tn{flex:1;min-width:140px}
.subs{margin:6px 0 0 22px;display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--line);padding-left:12px}
.bubbles{display:inline-flex;gap:4px}
.bubbles button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;padding:0;font-size:9px;font-family:var(--f-mono);color:var(--muted);display:grid;place-items:center}
.bubbles button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.inline-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inline-add input{flex:1;min-width:160px}
.tstat{font-size:.8rem;color:var(--muted);white-space:nowrap}

/* Formulários */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;font-family:var(--f-mono);font-size:.85rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .field label{text-align:center}
.days input{text-align:center;padding:8px 4px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Cronograma */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-family:var(--f-display);font-size:1rem}
.blk{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;background:var(--sunk);border-left:4px solid var(--c,var(--muted))}
.blk.done{opacity:.55}
.blk.done .bt{text-decoration:line-through}
.blk .bt{flex:1;min-width:0;font-size:.88rem;line-height:1.35}
.blk .bt b{display:block}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.tick.on{background:var(--accent);border-color:var(--accent)}

/* Ranking */
.board{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:36px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.row.me{background:var(--accent-soft);outline:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.row .pos{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;text-align:center}
.row img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.row .who{min-width:0}
.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-family:var(--f-mono);font-weight:700;text-align:right}
.matrix td.c{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:72px}
.matrix td.c.best{box-shadow:inset 0 0 0 2px var(--good)}
.matrix td.c.worst{box-shadow:inset 0 0 0 2px var(--bad)}
.matrix th.p{text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.help .card{background:var(--sunk);border-radius:8px;padding:12px 14px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgb(8 12 20 / .5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
/* Flashcards */
.modal textarea{font-family:var(--f-body);font-size:.92rem;min-height:90px}
.modal.wide,.modal.study{width:min(680px,100%)}
.study-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.face{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:24px 20px;min-height:200px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.face .q{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.face .a{border-top:1px dashed var(--line);padding-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.02rem}
.btn.flip{justify-content:center;padding:12px}
.btn.flip small{opacity:.8;font-weight:500}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.grades .btn{flex-direction:column;justify-content:center;padding:10px 8px;gap:2px;white-space:normal;text-align:center}
.grades .btn small{font-weight:500;color:var(--muted);font-size:.75rem}
.grades .btn.g0{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.grades .btn.g3{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.cardlist{display:flex;flex-direction:column;gap:6px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.9rem}
.citem .f{font-weight:600}
.citem .f,.citem .v{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.cact{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.deck{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.kpi a{color:var(--accent);font-weight:600}
/* Caderno de erros */
.err-item{border:1px solid var(--line);border-left:4px solid var(--c,var(--muted));border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.err-item.sup{opacity:.65}
.err-item .txt,.err-item .pw{white-space:pre-wrap;overflow-wrap:anywhere}
.err-item .lembrar{background:var(--accent-soft);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.err-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:.88rem}
.hbar .n{text-align:right}
/* Entrada */
.auth{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:32px 16px;max-width:1000px;margin:0 auto}
.auth h1{font-size:clamp(1.9rem,4vw,2.7rem);margin-top:8px}
.feat{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:16px}
.feat li{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:3px solid var(--accent)}
.feat span{color:var(--muted)}
.auth-form{gap:14px}
.auth-form .seg{display:flex}
.auth-form .seg button{flex:1}
.auth-form .btn.primary{justify-content:center;padding:11px 14px}
.okmsg{color:var(--good);font-size:.85rem}
input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
@media (max-width:800px){.auth{grid-template-columns:1fr;gap:28px;padding-block:8px}}
/* Liberação e administração */
.espera{max-width:560px;margin:40px auto;gap:14px}
.ou{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.google{justify-content:center;padding:10px 14px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:8px}
.who-a{display:flex;flex-direction:column;min-width:0}
.who-a b{overflow-wrap:anywhere}
@media (max-width:700px){.arow{grid-template-columns:1fr}}
/* Curvas */
.chart{position:relative;margin-top:6px}
.chart svg{touch-action:pan-y}
.ct{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.ct.cv{fill:var(--ink);font-weight:700;font-family:var(--f-mono)}
.tip{position:absolute;top:6px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.82rem;line-height:1.55;box-shadow:0 4px 14px rgb(0 0 0 / .14);pointer-events:none;max-width:calc(100% - 8px)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ln{display:inline-block;width:18px;height:2px;margin-right:6px;vertical-align:middle;border-radius:1px}
.ln.dash{background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 10px)}
.lgi{display:inline-flex;align-items:center}
.lgi b{margin-left:5px;color:var(--ink)}
.stack-bar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;min-width:0}
.stack-bar i{display:block;min-width:4px}
.stack-bar.empty-bar{background:var(--chip)}
.frows{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.frow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:.9rem}
.frow > .num{text-align:right}
.fname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdata{margin-top:8px;font-size:.85rem}
.tdata summary{cursor:pointer;color:var(--muted)}
@media (max-width:600px){
  .panel{padding:16px}
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .row{grid-template-columns:28px 30px minmax(0,1fr) auto;gap:8px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi .v{font-size:1.4rem}
  .citem{grid-template-columns:1fr}
  .cact{justify-content:flex-start}
  .hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 28px}
  .frow{grid-template-columns:minmax(0,1fr) 48px;row-gap:4px}
  .frow .fname{grid-column:1/-1}
}
@media (max-width:860px){
  nav.tabs{order:3;flex-basis:100%}
  .top .wrap{justify-content:space-between}
}

<script src="supabase.js"></script>
<script>
(function(){
"use strict";
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dkey(new Date());
const parseD = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate()+n); return dkey(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const pct = (a, q) => q > 0 ? Math.round(100 * a / q) : null;
const fmtH = min => { min = Math.round(min||0); const h = Math.floor(min/60), m = min%60; return h ? (m ? h+"h"+pad(m) : h+"h") : m+"min"; };
const fmtN = n => (n||0).toLocaleString("pt-BR");
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const WDL = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtD = k => { const d = parseD(k); return d.getDate()+" "+MES[d.getMonth()]; };
const CORES = ["#2F6FDE","#1C9C6B","#D9822B","#C2416B","#7A5AF5","#0E9AA7","#B08900","#6B7A8F","#E0564A","#3B8F2F"];
const TIPOS = {teoria:"Teoria", questoes:"Questões", revisao:"Revisão"};
const STATUS = ["Não visto","Teoria lida","Revisado","Dominado"];
const accClass = p => p == null ? "" : p >= 75 ? "good" : p >= 60 ? "warn" : "bad";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ---------- estado ----------
const S = {
  mode: "loading",   // loading | db | local
  uid: null, me: null, meLoaded: false,
  months: {},        // "YYYY-MM" -> itens[]
  all: {},           // uid -> doc do aluno
  profiles: {},
  db: null, user: null, meRef: null,
  tab: "painel",
  priv: {}, decks: {}, pending: new Set(), study: null,
  ui: { open: {}, rkMetric: "pontos", rkPeriod: "30", rkGroup: "concurso", importFor: null, addSubFor: null,
        fcView: "meus", fcOpen: {}, fcShufMat: "", fcShufN: "20", bulkMat: "", dkGroup: "concurso", erMat: "", erMot: "", erSt: "pend", lastFcMat: null, evMat: "", evModo: "semana" },
  dirty: false
};

// ---------- camada de dados ----------
let chain = Promise.resolve();
function queue(fn){ chain = chain.then(fn).catch(e => toast(errMsg(e))); return chain; }
function errMsg(e){
  const c = e && e.code, msg = (e && e.message) || "";
  if (c === "23514") return "Este conteúdo passou do limite de tamanho. Apague itens antigos e tente de novo.";
  if (/JWT|token|session/i.test(msg)) return "Sua sessão expirou. Recarregue a página e entre de novo.";
  if (/fetch|network/i.test(msg)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if (c === "42501") return "Você não tem permissão para alterar este dado.";
  if (c === "quota_exceeded") return "O espaço de dados desta página está cheio. Apague registros antigos para continuar.";
  if (c === "invalid_argument") return "Você só pode ver esta página. Peça ao dono acesso de Colaborador para salvar seus estudos.";
  if (c === "resource_exhausted") return "Muitas alterações seguidas. Espere alguns segundos e tente de novo.";
  return "Não foi possível salvar agora. Tente novamente em instantes.";
}
let saveTimer = null;
function saveMe(){
  if (!S.me) return;
  S.me.stats = computeStats();
  S.me.atualizadoEm = new Date().toISOString();
  if (S.mode === "local"){ persistLocal(); render(); return; }
  S.all[S.uid] = S.me;
  render();
  clearTimeout(saveTimer);
  S.saving = true;
  saveTimer = setTimeout(() => { saveTimer = null; const body = clone(S.me); queue(() => salvarMe(body)).then(() => { if (!saveTimer) S.saving = false; }); }, 350);
}
function saveMonth(mk){
  const itens = S.months[mk] || [];
  if (S.mode === "local"){ persistLocal(); return; }
  const body = { itens: clone(itens) };
  queue(() => upsertDoc("mes-" + mk, body));
}
function persistLocal(){ lsSet("gabarito-local", { me: S.me, months: S.months, priv: S.priv }); S.all = S.me ? { local: S.me } : {}; }

function allItems(){ const out = []; Object.values(S.months).forEach(a => (a||[]).forEach(i => out.push(i))); return out.sort((a,b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : (b.ts||0)-(a.ts||0))); }

// ---------- estrutura das matérias ----------
function leaves(m){
  const out = [];
  (m.topicos||[]).forEach(t => {
    if (t.subs && t.subs.length) t.subs.forEach(s => out.push({ mid:m.id, tid:t.id, sid:s.id, nome:s.nome, pai:t.nome, status:s.status||0, ref:s }));
    else out.push({ mid:m.id, tid:t.id, sid:null, nome:t.nome, pai:null, status:t.status||0, ref:t });
  });
  if (!out.length) out.push({ mid:m.id, tid:null, sid:null, nome:m.nome, pai:null, status:0, ref:null, vazio:true });
  return out;
}
const leafKey = (mid,tid,sid) => mid+"|"+(tid||"")+"|"+(sid||"");
function findMat(id){ return (S.me?.materias||[]).find(m => m.id === id); }
function findTop(m, tid){ return (m?.topicos||[]).find(t => t.id === tid); }
function topicLabel(mid, tid, sid){
  const m = findMat(mid); if (!m) return "";
  const t = findTop(m, tid); if (!t) return "";
  const s = sid ? (t.subs||[]).find(x => x.id === sid) : null;
  return s ? t.nome + " › " + s.nome : t.nome;
}

// ---------- estatísticas ----------
function computeStats(){
  const items = allItems();
  const total = { min:0, q:0, a:0 }, porMat = {}, dias = {}, porLeaf = {}, porTop = {};
  const corte = addDays(today(), -120), sem = {}, corteSem = addDays(today(), -7*16);
  items.forEach(i => {
    total.min += i.min||0; total.q += i.q||0; total.a += i.a||0;
    const pm = porMat[i.mid] || (porMat[i.mid] = { min:0, q:0, a:0 });
    pm.min += i.min||0; pm.q += i.q||0; pm.a += i.a||0;
    if (i.data >= corte){ const d = dias[i.data] || (dias[i.data] = { min:0, q:0, a:0 }); d.min += i.min||0; d.q += i.q||0; d.a += i.a||0; }
    if (i.data >= corteSem && i.q){ const mm = findMat(i.mid); if (mm){ const o = sem[weekKey(i.data)] || (sem[weekKey(i.data)] = {}), k = norm(mm.nome), pp = o[k] || (o[k] = [0, 0]); pp[0] += i.q || 0; pp[1] += i.a || 0; } }
  });
  const materias = {}; let somaN = 0, somaP = 0;
  (S.me?.materias||[]).forEach(m => {
    const lv = leaves(m).filter(l => !l.vazio);
    const cov = lv.length ? lv.reduce((s,l) => s + l.status, 0) / (3*lv.length) : 0;
    const pm = porMat[m.id] || { min:0, q:0, a:0 };
    const acc = pm.q ? pm.a/pm.q : 0;
    const nivel = Math.round(100*(0.4*cov + 0.6*acc));
    materias[m.id] = { nome:m.nome, key:norm(m.nome), cor:m.cor, min:pm.min, q:pm.q, a:pm.a, cov:Math.round(cov*100), nivel };
    const p = m.peso||3; somaN += nivel*p; somaP += p;
  });
  return { total, materias, dias, sem, nivel: somaP ? Math.round(somaN/somaP) : 0 };
}
function localDetail(){
  const items = allItems(), byLeaf = {}, byTop = {}, last = {};
  items.forEach(i => {
    const k = leafKey(i.mid, i.tid, i.sid);
    const b = byLeaf[k] || (byLeaf[k] = { q:0, a:0, min:0 }); b.q += i.q||0; b.a += i.a||0; b.min += i.min||0;
    if (i.tid){ const tk = i.mid+"|"+i.tid; const t = byTop[tk] || (byTop[tk] = { q:0, a:0, min:0 }); t.q += i.q||0; t.a += i.a||0; t.min += i.min||0; }
    if (!last[k] || last[k] < i.data) last[k] = i.data;
  });
  return { byLeaf, byTop, last };
}
function streak(dias){
  let n = 0, k = today();
  if (!(dias[k] && dias[k].min > 0)) k = addDays(k, -1);
  while (dias[k] && (dias[k].min > 0 || dias[k].q > 0)){ n++; k = addDays(k, -1); }
  return n;
}
function periodSum(st, period){
  if (!st) return { min:0, q:0, a:0 };
  if (period === "total") return st.total || { min:0, q:0, a:0 };
  const n = Number(period), ini = addDays(today(), -(n-1)), o = { min:0, q:0, a:0 };
  Object.entries(st.dias||{}).forEach(([k,v]) => { if (k >= ini){ o.min += v.min||0; o.q += v.q||0; o.a += v.a||0; } });
  return o;
}

// ---------- armazenamento privado e compartilhado ----------
const timers = {};
function writeDoc(path, bodyFn){
  if (S.mode === "local"){ persistLocal(); return; }
  S.pending.add(path); clearTimeout(timers[path]);
  timers[path] = setTimeout(() => {
    delete timers[path];
    const body = clone(bodyFn());
    queue(() => gravar(path, body)).then(() => { if (!timers[path]) S.pending.delete(path); });
  }, 500);
}
function privPath(key){ return "data/users/" + S.uid + "/" + key; }
function savePriv(key){ writeDoc(privPath(key), () => S.priv[key] || {}); render(); }
function saveDecks(){ writeDoc("baralhos/" + S.uid, () => ({ decks: S.decks[S.uid] || {} })); render(); }
function restoreVals(keep){
  Object.entries(keep).forEach(([id, val]) => { const el = document.getElementById(id); if (!el) return; if (el.type === "checkbox") el.checked = val; else el.value = val; });
}
const LIMITE = "Esta matéria chegou ao limite de espaço. Os itens mais recentes não foram salvos; apague alguns antigos.";
function ajustaLimite(key, arr){ const d = S.priv[key]; let n = 0; while (d && d[arr] && d[arr].length && JSON.stringify(d).length > 240000){ d[arr].pop(); n++; } return n; }
function cabeDecks(){
  if (JSON.stringify({ decks: S.decks[S.uid] || {} }).length > 240000){ toast("Seus baralhos compartilhados passaram do limite de tamanho. Remova um baralho ou compartilhe menos cards."); return false; }
  return true;
}
function fcDoc(mid){ const k = "fc-" + mid; if (!S.priv[k] || !Array.isArray(S.priv[k].cards)) S.priv[k] = { cards: [] }; return S.priv[k]; }
function erDoc(mid){ const k = "er-" + mid; if (!S.priv[k] || !Array.isArray(S.priv[k].itens)) S.priv[k] = { itens: [] }; return S.priv[k]; }
function allCards(){ const out = []; (S.me?.materias || []).forEach(m => (S.priv["fc-" + m.id]?.cards || []).forEach(c => out.push({ ...c, mid: m.id }))); return out; }
function allErros(){ const out = []; (S.me?.materias || []).forEach(m => (S.priv["er-" + m.id]?.itens || []).forEach(e => out.push({ ...e, mid: m.id }))); return out; }
function fcParaHoje(mid){ const cs = allCards().filter(c => !mid || c.mid === mid); return cs.filter(c => c.srs && c.srs.due <= today()).length + Math.min(20, cs.filter(c => !c.srs).length); }
function fcSum(d, period){
  const o = { n: 0, ok: 0 }, ini = period === "total" ? "" : addDays(today(), -(Number(period) - 1));
  Object.entries(d.fcDias || {}).forEach(([k, v]) => { if (k >= ini){ o.n += v.n || 0; o.ok += v.ok || 0; } });
  return o;
}
function estudados(m){ const lv = leaves(m).filter(l => !l.vazio); return lv.length ? `<b class="num">${lv.filter(l => l.status >= 1).length}</b> de ${lv.length} tópicos estudados` : "sem tópicos"; }
function segHtml(key, opts){ return `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" class="${S.ui[key] === v ? "on" : ""}" data-act="rk" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>`; }
function matOptions(sel, todas){ return (todas ? `<option value="">${todas}</option>` : "") + (S.me.materias || []).map(m => `<option value="${m.id}" ${sel === m.id ? "selected" : ""}>${esc(m.nome)}</option>`).join(""); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wireTopics(ids, pre){
  const [mS, tS, sS] = ids.map(i => document.getElementById(i));
  const fillSub = () => {
    const m = findMat(mS.value), t = findTop(m, tS.value), subs = t?.subs || [];
    sS.innerHTML = `<option value="">${subs.length ? "Tópico inteiro" : "—"}</option>` + subs.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join("");
    sS.disabled = !subs.length;
    if (pre.sid && t && t.id === pre.tid) sS.value = pre.sid;
  };
  const fillTop = () => {
    const m = findMat(mS.value);
    tS.innerHTML = `<option value="">Matéria inteira</option>` + (m?.topicos || []).map(t => `<option value="${t.id}">${esc(t.nome)}</option>`).join("");
    if (pre.tid && m && m.id === pre.mid) tS.value = pre.tid;
    fillSub();
  };
  mS.onchange = () => { pre.tid = null; pre.sid = null; fillTop(); };
  tS.onchange = () => { pre.sid = null; fillSub(); };
  fillTop();
}

// ---------- repetição espaçada ----------
function nextSrs(c, g){
  const s = Object.assign({ iv: 0, ef: 2.5, reps: 0, lapses: 0 }, (c && c.srs) || {});
  let iv;
  if (g === 0){ iv = 0; s.ef = Math.max(1.3, s.ef - 0.2); s.lapses++; }
  else if (g === 1){ iv = Math.max(1, Math.round(s.iv * 1.2)); s.ef = Math.max(1.3, s.ef - 0.15); }
  else if (g === 2){ iv = s.iv === 0 ? 1 : s.iv < 3 ? 3 : Math.round(s.iv * s.ef); }
  else { iv = s.iv === 0 ? 4 : Math.round(Math.max(s.iv + 2, s.iv * s.ef * 1.3)); s.ef = Math.min(3, s.ef + 0.15); }
  s.iv = iv; s.reps++; s.due = addDays(today(), iv); s.ult = today();
  return s;
}
function ivLabel(n){
  if (n === 0) return "hoje";
  if (n === 1) return "1 dia";
  if (n < 30) return n + " dias";
  if (n < 365){ const m = Math.round(n / 30); return m === 1 ? "1 mês" : m + " meses"; }
  return (n / 365).toFixed(1).replace(".", ",") + " anos";
}
function contaFC(ok){
  const me = S.me, k = today(); me.fcDias = me.fcDias || {};
  const d = me.fcDias[k] || (me.fcDias[k] = { n: 0, ok: 0 }); d.n++; if (ok) d.ok++;
  const corte = addDays(k, -120); Object.keys(me.fcDias).forEach(x => { if (x < corte) delete me.fcDias[x]; });
}

// ---------- sessão de estudo (cards e erros) ----------
function startStudy(opts){
  if (!opts.items.length){ toast(opts.vazio || "Nada para revisar agora."); return; }
  S.study = { ...opts, i: 0, shown: false, ok: 0, done: 0 };
  renderStudy();
}
function renderStudy(){
  const st = S.study, root = $("#modalRoot");
  if (!st){ closeModal(); return; }
  if (st.i >= st.items.length){
    const resumo = st.mode === "erros" ? `${st.done} ${st.done === 1 ? "erro revisado" : "erros revisados"}, ${st.ok} ${st.ok === 1 ? "marcado" : "marcados"} como superado.` : `${st.done} cards · ${st.done ? Math.round(100 * st.ok / st.done) : 0}% lembrados.`;
    root.innerHTML = `<div class="scrim"><div class="modal study" role="dialog" aria-modal="true"><h2>Sessão concluída</h2><p style="margin:0">${resumo}</p><div class="actions"><button class="btn primary" id="sClose" data-sact="close">Fechar</button></div></div></div>`;
    $("#sClose").focus();
    return;
  }
  const it = st.items[st.i];
  const grades = st.mode === "srs"
    ? [[0, "Errei"], [1, "Difícil"], [2, "Bom"], [3, "Fácil"]].map(([g, l]) => `<button class="btn g${g}" data-sact="grade" data-g="${g}">${l}<small>${g + 1} · volta em ${ivLabel(nextSrs(it.card, g).iv)}</small></button>`).join("")
    : st.mode === "erros"
      ? `<button class="btn g0" data-sact="grade" data-g="0">Ainda erraria<small>1 · continua pendente</small></button><button class="btn g3" data-sact="grade" data-g="3">Já sei<small>2 · marcar superado</small></button>`
      : `<button class="btn g0" data-sact="grade" data-g="0">Errei<small>tecla 1</small></button><button class="btn g3" data-sact="grade" data-g="3">Acertei<small>tecla 2</small></button>`;
  root.innerHTML = `<div class="scrim"><div class="modal study" role="dialog" aria-modal="true" aria-label="${esc(st.title)}">
    <div class="study-h"><div><span class="label">${esc(st.title)}</span><div class="small muted num">${st.i + 1} de ${st.items.length}</div></div><button class="btn ghost sm" id="sClose" data-sact="close">Encerrar</button></div>
    <div class="meter"><i style="width:${Math.round(100 * st.i / st.items.length)}%"></i></div>
    <div class="face" style="border-left:4px solid ${it.cor || "var(--line)"}">
      <span class="small muted">${esc(it.meta || "")}</span>
      <div class="q">${esc(it.front)}</div>
      ${st.shown ? `<div class="a">${esc(it.back || "(sem resposta cadastrada)")}</div>` : ""}
    </div>
    ${st.shown ? `<div class="grades">${grades}</div>` : `<button class="btn primary flip" data-sact="flip">Mostrar resposta <small>(espaço)</small></button>`}
  </div></div>`;
}
function gradeStudy(g){
  const st = S.study; if (!st || st.i >= st.items.length) return;
  const it = st.items[st.i];
  st.done++; if (g > 0) st.ok++;
  st.onGrade(it, g);
  if (st.mode === "srs" && g === 0 && !it.relearn){ const cur = fcDoc(it.mid).cards.find(x => x.id === it.card.id); if (cur) st.items.push({ ...it, relearn: true, card: clone(cur) }); }
  st.i++; st.shown = false; renderStudy();
}
function cardItem(c){
  const m = findMat(c.mid), tl = c.tid ? topicLabel(c.mid, c.tid, c.sid) : "";
  return { mid: c.mid, card: clone(c), front: c.f, back: c.v, cor: m?.cor, meta: (m?.nome || "") + (tl ? " · " + tl : "") };
}
function sessaoRevisao(mid){
  const cards = allCards().filter(c => !mid || c.mid === mid), hoje = today();
  const due = cards.filter(c => c.srs && c.srs.due <= hoje).sort((a, b) => (a.srs.due < b.srs.due ? -1 : a.srs.due > b.srs.due ? 1 : 0));
  const novos = cards.filter(c => !c.srs).slice(0, 20);
  startStudy({ title: "Revisão do dia", mode: "srs", vazio: "Nenhum card para revisar hoje. Volte amanhã ou use o modo embaralhado.", items: [...due, ...novos].map(cardItem), onGrade: (it, g) => {
    const c = fcDoc(it.mid).cards.find(x => x.id === it.card.id);
    if (c){ c.srs = nextSrs(c, g); writeDoc(privPath("fc-" + it.mid), () => S.priv["fc-" + it.mid]); }
    contaFC(g > 0); saveMe();
  } });
}
function sessaoEmbaralhada(mid, n){
  const items = shuffle(allCards().filter(c => !mid || c.mid === mid)).slice(0, n || 20).map(cardItem);
  startStudy({ title: "Embaralhado", mode: "livre", vazio: "Não há cards nesta matéria ainda.", items, onGrade: (it, g) => { contaFC(g > 0); saveMe(); } });
}
function praticarBaralho(o, did){
  const d = S.decks[o]?.[did]; if (!d) return;
  const items = shuffle((d.cards || []).map(c => ({ front: c.f, back: c.v, cor: d.cor, meta: d.materia + " · baralho de " + nomeDe(o) }))).slice(0, 50);
  startStudy({ title: d.titulo, mode: "livre", vazio: "Este baralho está vazio.", items, onGrade: (it, g) => { contaFC(g > 0); saveMe(); } });
}
function copiarBaralho(o, did){
  const d = S.decks[o]?.[did]; if (!d) return;
  let m = (S.me.materias || []).find(x => norm(x.nome) === d.mkey), criada = false;

  const pend = all.filter(e => !e.sup), revs = all.reduce((s, e) => s + (e.revs || 0), 0);
  const porMot = {}; pend.forEach(e => { porMot[e.motivo] = (porMot[e.motivo] || 0) + 1; });
  const motRows = Object.entries(MOTIVOS).map(([k, l]) => [k, l, porMot[k] || 0]).filter(r => r[2]).sort((a, b) => b[2] - a[2]);

// ---------- curvas: dados ----------
function weekKey(k){ const d = parseD(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkey(d); }
function weeksBack(n){ const out = [], w0 = weekKey(today()); for (let i = n - 1; i >= 0; i--) out.push(addDays(w0, -7 * i)); return out; }
function qaSem(sem, wk, key){
  const o = (sem || {})[wk] || {};
  if (key) return o[key] || [0, 0];
  let q = 0, a = 0; Object.values(o).forEach(p => { q += p[0] || 0; a += p[1] || 0; }); return [q, a];
}
function curva(sem, key, movel){
  const ws = weeksBack(15), pts = ws.map(w => qaSem(sem, w, key));
  return ws.slice(3).map((w, j) => {
    const i = j + 3; let q = 0, a = 0;
    for (let k = movel ? i - 3 : i; k <= i; k++){ q += pts[k][0]; a += pts[k][1]; }
    return { w, q, a, r: q ? 100 * a / q : null };
  });
}
function soma(c, ini, fim){ return c.slice(ini, fim).reduce((o, p) => [o[0] + p.q, o[1] + p.a], [0, 0]); }
function curvaFC(fcDias){
  const by = {};
  Object.entries(fcDias || {}).forEach(([k, v]) => { const w = weekKey(k), b = by[w] || (by[w] = { n: 0, ok: 0 }); b.n += v.n || 0; b.ok += v.ok || 0; });
  return weeksBack(12).map(w => { const b = by[w] || { n: 0, ok: 0 }; return { w, n: b.n, ok: b.ok, r: b.n ? 100 * b.ok / b.n : null }; });
}
function colegas(){
  const meC = norm(S.me.concurso);
  return Object.keys(S.all).filter(id => id !== S.uid && S.all[id] && S.all[id].stats && (!meC || norm(S.all[id].concurso) === meC));
}
const media = xs => xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
function frescor(){
  const det = localDetail(), hoje = today(), tot = { f7: 0, f30: 0, fold: 0, nunca: 0 }, por = [];
  (S.me.materias || []).forEach(m => {
    const c = { f7: 0, f30: 0, fold: 0, nunca: 0 };
    leaves(m).forEach(l => {
      if (l.vazio) return;
      const d = [det.last[leafKey(l.mid, l.tid, l.sid)], l.sid ? det.last[leafKey(l.mid, l.tid, null)] : null].filter(Boolean).sort().pop();
      let k;
      if (d){ const dd = diffDays(d, hoje); k = dd <= 7 ? "f7" : dd <= 30 ? "f30" : "fold"; }
      else k = l.status >= 1 ? "fold" : "nunca";
      c[k]++; tot[k]++;
    });
    por.push([m, c]);
  });
  return { tot, por };
}
const TONS = ["var(--s1)", "color-mix(in srgb,var(--s1) 55%,var(--surface))", "color-mix(in srgb,var(--s1) 30%,var(--surface))", "repeating-linear-gradient(135deg,var(--chip) 0 4px,var(--line) 4px 6px)"];
const LEG_TOP = [["f7", "Estudado há até 7 dias"], ["f30", "Há 8 a 30 dias"], ["fold", "Há mais de 30 dias"], ["nunca", "Nunca estudado"]];
const LEG_FC = [["ok", "Em dia (próxima revisão em 8+ dias)"], ["breve", "Revisão nos próximos 7 dias"], ["venc", "Revisão vencida"], ["novo", "Nunca revisado"]];
function stackBar(c, leg, label){
  const tot = leg.reduce((s, [k]) => s + (c[k] || 0), 0);
  if (!tot) return `<div class="stack-bar empty-bar" role="img" aria-label="${esc(label)}: sem itens"></div>`;
  return `<div class="stack-bar" role="img" aria-label="${esc(label)}: ${leg.map(([k, l]) => `${l} ${c[k] || 0}`).join(", ")}">${leg.map(([k, l], i) => c[k] ? `<i style="flex:${c[k]};background:${TONS[i]}" title="${esc(l)}: ${c[k]} (${Math.round(100 * c[k] / tot)}%)"></i>` : "").join("")}</div>`;
}
function legenda(leg, c){ return `<div class="legend">${leg.map(([k, l], i) => `<span class="lgi"><i class="sw" style="background:${TONS[i]}"></i>${esc(l)}${c ? ` <b class="num">${c[k] || 0}</b>` : ""}</span>`).join("")}</div>`; }

// ---------- curvas: gráfico de linhas com hover ----------
function drawCharts(){ (S.charts || []).forEach(c => { const el = document.getElementById(c.id); if (el) drawLine(el, c.cfg); }); }
let rzT = null;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 150); });
function drawLine(el, cfg){
  const W = Math.max(260, Math.floor(el.clientWidth || 600)), H = cfg.h || 240;
  const m = { l: 40, r: 46, t: 12, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b, n = cfg.x.length, yMax = 100;
  const X = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => m.t + ih * (1 - Math.max(0, Math.min(yMax, v)) / yMax);
  let g = "";
  if (cfg.band) g += `<rect x="${m.l}" y="${Y(cfg.band[1])}" width="${iw}" height="${Y(cfg.band[0]) - Y(cfg.band[1])}" style="fill:var(--accent-soft)"/><text x="${m.l + 6}" y="${Y(cfg.band[1]) - 4}" class="ct">${esc(cfg.bandLabel || "")}</text>`;
  [0, 25, 50, 75, 100].forEach(t => { g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end" class="ct">${t}%</text>`; });
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 62))));
  cfg.x.forEach((lab, i) => { if ((n - 1 - i) % step === 0) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" class="ct">${esc(lab)}</text>`; });
  if (cfg.marks) cfg.marks.forEach(i => { g += `<line x1="${X(i)}" x2="${X(i)}" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--line)" stroke-dasharray="2 3"/>`; });
  const ends = [];
  cfg.series.forEach(s => {
    let d = "", pen = false;
    s.v.forEach((v, i) => { if (v == null){ pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    if (d) g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="6 4"' : ""}/>`;
    s.v.forEach((v, i) => {
      if (v == null) return;
      const solo = (s.v[i - 1] == null) && (s.v[i + 1] == null);
      if (s.dots !== false || solo) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
    });
    let li = -1; s.v.forEach((v, i) => { if (v != null) li = i; });
    if (li >= 0) ends.push({ x: X(li), y: Y(s.v[li]), txt: Math.round(s.v[li]) + "%" });
  });
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach(e => { g += `<text x="${(e.x + 8).toFixed(1)}" y="${(e.y + 4).toFixed(1)}" class="ct cv">${e.txt}</text>`; });
  g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--muted)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect x="${m.l - 12}" y="0" width="${iw + 24}" height="${H}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.label)}">${g}</svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round(n === 1 ? 0 : (x - m.l) * (n - 1) / iw)));
    const html = cfg.tip(i); if (!html) return hide();
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = html; tip.hidden = false;
    const px = X(i) * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, px + 14 + tw > r.width ? px - tw - 14 : px + 14) + "px";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", hide);
}
function curvaIlustr(){
  const revs = [1, 7, 30], est = [1.2, 4, 12, 40], sem = [], com = [];
  for (let t = 0; t <= 35; t++){
    sem.push(20 + 80 * Math.exp(-t / est[0]));
    let ult = 0, k = 0; revs.forEach((r, j) => { if (t >= r){ ult = r; k = j + 1; } });
    const piso = 20 + 15 * k; com.push(piso + (100 - piso) * Math.exp(-(t - ult) / est[k]));
  }
  return { sem, com, revs };
}

function viewEvolucao(){

    const crs = cols.map(id => { const [q, a] = soma(curva(S.all[id].stats.sem, k, false), 8, 12); return q >= 10 ? 100 * a / q : null; }).filter(x => x != null);
    const gm = media(crs), pos = r2 != null ? [r2, ...crs].sort((a, b) => b - a).indexOf(r2) + 1 : null;

function traduzAuth(e){
  const m = (e && e.message) || "";
  if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/already (been )?registered/i.test(m)) return "Este e-mail já tem conta. Use a opção Entrar.";
  if (/not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if (/rate limit|too many/i.test(m)) return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if (/password/i.test(m)) return "Senha inválida: use pelo menos 6 caracteres.";
  if (/fetch|network/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  return "Não foi possível concluir: " + m;
}

async function entrar(){
  const email = $("#aEmail").value.trim(), senha = $("#aSenha").value, modo = S.authModo;
  const msg = (t, ok) => { const el = $("#aMsg"); el.textContent = t; el.className = ok ? "okmsg" : "err"; el.hidden = false; };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg("Digite um e-mail válido.");
  if (senha.length < 6) return msg("A senha precisa ter pelo menos 6 caracteres.");
  const btn = $("#aBtn"), rot = btn.textContent; btn.disabled = true; btn.textContent = modo === "entrar" ? "Entrando…" : "Criando conta…";
  try {
    if (modo === "criar"){
      const { data, error } = await S.sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) msg("Conta criada. Abra o link de confirmação enviado ao seu e-mail e depois entre aqui.", true);
    } else {
      const { error } = await S.sb.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
    }
  } catch(e){ msg(traduzAuth(e)); }
  finally { if (document.body.contains(btn)){ btn.disabled = false; btn.textContent = rot; } }
}
function pubRow(r){ return { apelido: r.apelido || "", concurso: r.concurso || "", stats: r.stats || {}, fcDias: r.fc_dias || {} }; }
async function startSupa(user){
  if (S.uid === user.id && (S.meLoaded || S.esperando)) return;
  S.uid = user.id; S.email = user.email || ""; S.mode = "db";
  $("#view").innerHTML = `<div class="empty"><h3>Carregando seus estudos…</h3><p>Seu painel, matérias e o ranking do grupo aparecem em instantes.</p></div>`;
  try {
    const pf = await S.sb.from("perfis").select("status,papel,nome,email").eq("user_id", user.id).maybeSingle();
    if (pf.error) throw pf.error;
    S.perfil = pf.data || { status: "pendente", papel: "aluno" };
  } catch(e){
    S.uid = null;
    $("#view").innerHTML = `<div class="empty"><h3>Não foi possível carregar seu acesso</h3><p>${esc(errMsg(e))}</p><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  if (S.perfil.status !== "aprovado"){ renderEspera(); return; }
  S.isAdmin = S.perfil.papel === "admin";
  $("#tabs").hidden = false; $("#tabAdmin").hidden = !S.isAdmin;
  if (!S.isAdmin && S.tab === "admin") setTab("painel", true);
  try {
    const [d, p, b] = await Promise.all([
      S.sb.from("docs").select("chave,dados"),
      S.sb.from("publico").select("user_id,apelido,concurso,stats,fc_dias"),
      S.sb.from("baralhos").select("user_id,decks")
    ]);
    const err = d.error || p.error || b.error; if (err) throw err;
    S.me = null; S.months = {}; S.priv = {};
    (d.data || []).forEach(r => {
      if (r.chave === "me") S.me = r.dados;
      else if (r.chave.indexOf("mes-") === 0) S.months[r.chave.slice(4)] = (r.dados && r.dados.itens) || [];
      else S.priv[r.chave] = r.dados;
    });
    S.all = {}; (p.data || []).forEach(r => { if (r.user_id !== S.uid) S.all[r.user_id] = pubRow(r); });
    if (S.me) S.all[S.uid] = S.me;
    S.decks = {}; (b.data || []).forEach(r => { S.decks[r.user_id] = r.decks || {}; });
  } catch(e){
    S.uid = null;
    $("#view").innerHTML = `<div class="empty"><h3>Não foi possível carregar seus dados</h3><p>${esc(errMsg(e))}</p><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  S.meLoaded = true; render(true);
  S.sb.channel("grupo")
    .on("postgres_changes", { event: "*", schema: "public", table: "publico" }, ch => {
      const r = ch.new && ch.new.user_id ? ch.new : null, id = r ? r.user_id : (ch.old && ch.old.user_id);
      if (!id || id === S.uid) return;
      if (ch.eventType === "DELETE") delete S.all[id]; else S.all[id] = pubRow(r);
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "baralhos" }, ch => {
      const r = ch.new; if (!r || !r.user_id || r.user_id === S.uid) return;
      S.decks[r.user_id] = r.decks || {}; render();
    })
    .subscribe();
  if (S.isAdmin){
    carregarAdmin();
    let t = null;
    S.sb.channel("adm").on("postgres_changes", { event: "*", schema: "public", table: "perfis" }, () => { clearTimeout(t); t = setTimeout(carregarAdmin, 400); }).subscribe();
  }
}
async function upsertDoc(chave, dados){ const { error } = await S.sb.from("docs").upsert({ user_id: S.uid, chave, dados }); if (error) throw error; }
async function salvarMe(body){
  await upsertDoc("me", body);
  const { error } = await S.sb.from("publico").upsert({ user_id: S.uid, apelido: String(body.apelido || "").slice(0, 40), concurso: String(body.concurso || "").slice(0, 80), stats: body.stats || {}, fc_dias: body.fcDias || {} });
  if (error) throw error;
}
async function gravar(path, body){
  if (path.indexOf("baralhos/") === 0){ const { error } = await S.sb.from("baralhos").upsert({ user_id: S.uid, decks: body.decks || {} }); if (error) throw error; return; }
  return upsertDoc(path.split("/").pop(), body);
}

    </div>

      ${pend.length ? `<div class="stack" style="gap:8px">${pend.map(linhaPend).join("")}</div>` : `<p class="muted" style="margin:0">Nenhum pedido pendente. Quando alguém criar conta, aparece aqui.</p>`}</div>
    <div class="panel"><div class="panel-h"><h2>Com acesso</h2></div><div class="stack" style="gap:8px">${apr.map(linhaApr).join("")}</div></div>

    <div class="notice small">Para redefinir a senha de alguém, use o painel do Supabase em Authentication → Users.</div>
  </div>`;
}
function startLocal(){
  S.mode = "local"; S.uid = "local";
  const saved = lsGet("gabarito-local");
  S.me = saved?.me || null; S.months = saved?.months || {}; S.priv = saved?.priv || {};
  S.meLoaded = true; S.all = S.me ? { local: S.me } : {};
  render();
}
function startDb(db, user, id){
  S.mode = "db"; S.db = db; S.user = user; S.uid = id;
  S.meRef = db.doc("alunos/" + id);
  S.meRef.onSnapshot(s => {
    if (S.me && (S.saving || (s.metadata && s.metadata.hasPendingWrites))) return;
    S.me = s.exists ? clone(s.data()) : null; S.meLoaded = true;
    if (S.me) S.all[S.uid] = S.me;
    render();
  }, e => { toast(errMsg(e)); });
  S.meRef.collection("meses").onSnapshot(q => {
    const m = {}; q.docs.forEach(d => { m[d.id] = clone(d.data().itens || []); });
    S.months = m; render();
  }, () => {});
  db.collection("data/users/" + id).onSnapshot(q => {
    q.docs.forEach(d => { if (!S.pending.has(privPath(d.id))) S.priv[d.id] = clone(d.data()); });
    render();
  }, () => {});
  db.collection("baralhos").onSnapshot(q => {
    const out = {}; q.docs.forEach(d => { out[d.id] = clone(d.data().decks || {}); });
    if (S.pending.has("baralhos/" + S.uid)) out[S.uid] = S.decks[S.uid] || {};
    S.decks = out; render();
  }, () => {});
  db.collection("alunos").onSnapshot(q => {
    const a = {}; q.docs.forEach(d => { a[d.id] = d.data(); });
    if (S.me) a[S.uid] = S.me;
    S.all = a; resolveProfiles(); render();
  }, () => {});
}
async function resolveProfiles(){
  if (!S.user) return;
  try { const ids = Object.keys(S.all); if (!ids.length) return; S.profiles = await S.user.profiles(ids); render(); } catch(e){}
}
function nomeDe(id){
  const d = S.all[id];
  if (d && d.apelido) return d.apelido;
  const p = S.profiles[id];
  return (p && p.name) || "Aluno";
}
function avatarDe(id){
  const p = S.profiles[id];
  if (p && p.avatarUrl) return p.avatarUrl;
  const n = nomeDe(id), c = CORES[Math.abs([...id].reduce((s,ch) => s*31 + ch.charCodeAt(0), 7)) % CORES.length];
  const ini = n.split(/\s+/).map(x => x[0]).join("").slice(0,2).toUpperCase();
  return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34"><rect width="34" height="34" rx="17" fill="${c}"/><text x="17" y="22" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">${esc(ini)}</text></svg>`);
}

// ---------- navegação ----------
function setTab(t, silent){
  if (!["painel","evolucao","materias","cronograma","flashcards","erros","ranking","perfil","admin"].includes(t)) t = "painel";
  S.tab = t;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === t ? "page" : "false"));
  if (!silent) render(true);
}

// ---------- renderização ----------
function render(force){
  const v = $("#view");
  const ae = document.activeElement;
  if (!force && ae && v.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ S.dirty = true; return; }
  S.dirty = false;
  if (S.mode === "loading" || !S.meLoaded){ return; }
  $("#btnReg").hidden = !S.me;
  const keep = {};
  if (!force) v.querySelectorAll("input[id],textarea[id],select[id]").forEach(el => { keep[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  if (!S.me){ v.innerHTML = viewOnboarding(); restoreVals(keep); return; }
  const fn = { painel:viewPainel, evolucao:viewEvolucao, materias:viewMaterias, cronograma:viewCronograma, flashcards:viewFlashcards, erros:viewErros, ranking:viewRanking, perfil:viewPerfil, admin:viewAdmin }[S.tab];
  v.innerHTML = (S.mode === "local" ? `<div class="notice small" style="margin-bottom:20px">Modo individual: seus dados ficam só neste navegador. Abra esta página pelo link compartilhado no Claude para salvar na nuvem e entrar no ranking do grupo.</div>` : "") + fn();
  restoreVals(keep);
  drawCharts();
}
document.addEventListener("focusout", e => { if (e.relatedTarget && e.relatedTarget.tagName === "BUTTON" && $("#view").contains(e.relatedTarget)) return; setTimeout(() => { if (S.dirty) render(); }, 0); });

function viewPainel(){
  const me = S.me, st = me.stats || computeStats(), det = localDetail();
  const tot = st.total, s7 = periodSum(st, "7"), acc = pct(tot.a, tot.q);
  const meta = (me.metaSemanalH||0)*60, metaP = meta ? Math.min(100, Math.round(100*s7.min/meta)) : 0;
  const prova = me.cronograma?.cfg?.dataProva || me.dataProva;
  const faltam = prova ? diffDays(today(), prova) : null;
  const fcHoje = fcParaHoje(), erPend = allErros().filter(e => !e.sup).length;
  const mats = me.materias || [];

  const linhas = mats.map(m => {
    const x = st.materias[m.id] || { nivel:0, cov:0, q:0, a:0, min:0 }, p = pct(x.a, x.q);
    return `<tr><td><span class="swatch" style="background:${m.cor}"></span>${esc(m.nome)}</td>
      <td style="min-width:140px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${x.nivel}%;background:${m.cor}"></i></div><span class="num">${x.nivel}</span></div></td>
      <td class="r num">${x.cov}%</td>
      <td class="r">${p == null ? '<span class="muted">—</span>' : `<span class="pill ${accClass(p)}">${p}%</span>`}</td>
      <td class="r num">${fmtN(x.q)}</td><td class="r num">${fmtH(x.min)}</td></tr>`;
  }).join("");

  // Onde melhorar
  const fracos = [], naoVistos = [];
  mats.forEach(m => leaves(m).forEach(l => {
    if (l.vazio) return;
    const b = det.byLeaf[leafKey(l.mid, l.tid, l.sid)];
    if (b && b.q >= 5 && b.a/b.q < 0.7) fracos.push({ m, l, p: Math.round(100*b.a/b.q), q: b.q });
    else if (l.status === 0 && !b) naoVistos.push({ m, l });
  }));
  fracos.sort((a,b) => a.p - b.p);
  const weakHtml = fracos.slice(0,6).map(f => `<li><div class="t"><b>${esc(f.l.nome)}</b><span class="small muted"><span class="swatch" style="background:${f.m.cor}"></span>${esc(f.m.nome)}${f.l.pai ? " · " + esc(f.l.pai) : ""} · ${f.q} questões</span></div><span class="pill ${accClass(f.p)}">${f.p}%</span></li>`).join("");
  const nvHtml = naoVistos.slice(0, Math.max(0, 6 - fracos.slice(0,6).length)).map(f => `<li><div class="t"><b>${esc(f.l.nome)}</b><span class="small muted"><span class="swatch" style="background:${f.m.cor}"></span>${esc(f.m.nome)}</span></div><span class="pill">não iniciado</span></li>`).join("");

  // Heatmap 15 semanas
  const cells = []; const fim = today(); const d0 = parseD(fim);
  let k = addDays(fim, -(7*14) - d0.getDay());
  const maxMin = Math.max(60, ...Object.values(st.dias||{}).map(x => x.min||0));
  for (let i = 0; i < 7*15; i++){
    const v = (st.dias||{})[k]?.min || 0, fut = k > fim;
    const a = v ? 0.25 + 0.75*Math.min(1, v/maxMin) : 0;
    cells.push(`<i title="${fmtD(k)}: ${fmtH(v)}" style="${fut ? "opacity:.25;" : ""}${v ? `background:color-mix(in srgb,var(--accent) ${Math.round(a*100)}%,var(--chip))` : ""}"></i>`);
    k = addDays(k, 1);
  }

  const recentes = allItems().slice(0, 8).map(i => {
    const m = findMat(i.mid), p = pct(i.a, i.q);
    return `<tr><td class="num small">${fmtD(i.data)}</td><td><span class="swatch" style="background:${m?.cor||"var(--muted)"}"></span>${esc(m?.nome || "Matéria removida")}<div class="small muted">${esc(topicLabel(i.mid, i.tid, i.sid))}</div></td>
      <td><span class="pill">${TIPOS[i.tipo]||""}</span></td><td class="r num">${i.min ? fmtH(i.min) : "—"}</td>
      <td class="r">${p == null ? '<span class="muted">—</span>' : `<span class="num">${i.a}/${i.q}</span> <span class="pill ${accClass(p)}">${p}%</span>`}</td>
      <td class="r"><button class="btn ghost sm" data-act="delReg" data-id="${i.id}" data-mk="${i.data.slice(0,7)}" aria-label="Apagar registro">Apagar</button></td></tr>`;
  }).join("");

  return `<div class="stack">
    <div class="hello"><div><p class="label">${esc(me.concurso || "Seu concurso")}</p><h1>Olá, ${esc(me.apelido || "estudante")}</h1></div>
      ${faltam != null && faltam >= 0 ? `<div class="countdown"><div class="num">${faltam}</div><div class="small muted">dias para a prova (${fmtD(prova)})</div></div>` : ""}</div>
    <div class="kpis">
      <div class="kpi"><span class="label">Nível geral</span><span class="v">${st.nivel}<span class="small muted">/100</span></span><div class="meter"><i style="width:${st.nivel}%"></i></div><span class="s">40% cobertura do edital + 60% acerto</span></div>
      <div class="kpi"><span class="label">Últimos 7 dias</span><span class="v">${fmtH(s7.min)}</span><div class="meter"><i style="width:${metaP}%"></i></div><span class="s">${meta ? metaP + "% da meta de " + me.metaSemanalH + "h" : "Defina uma meta no Perfil"}</span></div>
      <div class="kpi"><span class="label">Horas no total</span><span class="v">${fmtH(tot.min)}</span><span class="s">Sequência atual: ${streak(st.dias||{})} dia(s)</span></div>
      <div class="kpi"><span class="label">Questões feitas</span><span class="v">${fmtN(tot.q)}</span><span class="s">${fmtN(tot.a)} acertos · ${fmtN(tot.q - tot.a)} erros</span></div>
      <div class="kpi"><span class="label">Acerto geral</span><span class="v">${acc == null ? "—" : acc + "%"}</span><span class="s">${acc == null ? "Registre questões para medir" : acc >= 75 ? "Bom nível para prova" : acc >= 60 ? "Perto da faixa de aprovação" : "Precisa de reforço"}</span></div>
      <div class="kpi"><span class="label">Flashcards para hoje</span><span class="v">${fcHoje}</span><span class="s"><a href="#flashcards">Revisar cards</a> · <a href="#erros">${erPend} ${erPend === 1 ? "erro pendente" : "erros pendentes"}</a></span></div>
    </div>
    <div class="panel"><div class="panel-h"><h2>Desempenho por matéria</h2><div class="controls"><a class="btn sm" href="#evolucao">Ver evolução</a><a class="btn sm" href="#materias">Editar matérias</a></div></div>
      ${mats.length ? `<div class="tw"><table><thead><tr><th>Matéria</th><th>Nível</th><th class="r">Cobertura</th><th class="r">Acerto</th><th class="r">Questões</th><th class="r">Horas</th></tr></thead><tbody>${linhas}</tbody></table></div>`
        : `<div class="empty"><h3>Nenhuma matéria ainda</h3><p>Cadastre as matérias do seu edital para começar a medir.</p><a class="btn primary" href="#materias">Cadastrar matérias</a></div>`}
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h2>Onde melhorar</h2><span class="small muted">acerto abaixo de 70% (5+ questões)</span></div>
        ${weakHtml || nvHtml ? `<div class="weak"><ul>${weakHtml}${nvHtml}</ul></div>` : `<p class="muted">Nada pendente por aqui. Continue registrando questões por tópico para encontrar seus pontos fracos.</p>`}
      </div>
      <div class="panel"><div class="panel-h"><h2>Constância</h2><span class="small muted">últimas 15 semanas</span></div>
        <div class="heat">${cells.join("")}</div>
        <div class="legend" style="margin-top:10px"><span>Cada quadrado é um dia; quanto mais escuro, mais horas estudadas.</span></div>
      </div>
    </div>
    <div class="panel"><div class="panel-h"><h2>Registros recentes</h2></div>
      ${recentes ? `<div class="tw"><table><thead><tr><th>Data</th><th>Matéria / tópico</th><th>Tipo</th><th class="r">Tempo</th><th class="r">Acertos</th><th></th></tr></thead><tbody>${recentes}</tbody></table></div>`
        : `<div class="empty"><h3>Nenhum estudo registrado</h3><p>Use “Registrar estudo” depois de cada sessão de teoria ou bateria de questões.</p><button class="btn primary" data-act="registrar">Registrar o primeiro estudo</button></div>`}
    </div>
  </div>`;
}

function bubbles(status, data){

}
function viewMaterias(){

      const imp = S.ui.importFor === m.id;

    <div style="display:flex;justify-content:flex-end;gap:8px">${cr ? `<button type="button" class="btn ghost" data-act="limparCron">Apagar cronograma</button>` : ""}<button class="btn primary" type="submit" ${mats.length ? "" : "disabled"}>${cr ? "Gerar de novo" : "Gerar cronograma"}</button></div>
  </form>`;
  if (!mats.length) return `<div class="stack"><div><p class="label">Planejamento</p><h1>Cronograma</h1></div><div class="panel empty"><h3>Cadastre suas matérias primeiro</h3><p>O cronograma é montado a partir das matérias, tópicos e do seu desempenho.</p><a class="btn primary" href="#materias">Ir para Matérias</a></div></div>`;
  let plan = "";
  if (cr && cr.dias){
    const tot = cr.dias.reduce((s,d) => s + d.blocos.length, 0), feitos = cr.dias.reduce((s,d) => s + d.blocos.filter(b => b.feito).length, 0);
    const hoje = today();
    const dias = cr.dias.map((d, di) => {
      const mins = d.blocos.reduce((s,b) => s + b.min, 0);
      const bl = d.blocos.map(b => {
        const m = findMat(b.mid);

          <button class="tick ${b.feito ? "on" : ""}" data-act="tick" data-d="${di}" data-b="${b.id}" aria-label="${b.feito ? "Desmarcar bloco" : "Concluir e registrar bloco"}">${b.feito ? "✓" : ""}</button>
          <div class="bt"><b>${esc(m?.nome || "Matéria removida")}</b>${esc(topicLabel(b.mid, b.tid, b.sid) || "")}<div class="small muted">${TIPOS[b.tipo]} · ${b.min} min</div></div></div>`;
      }).join("");
      return `<div class="day ${d.data === hoje ? "today" : ""}"><div class="day-h"><b>${WDL[parseD(d.data).getDay()]}, ${fmtD(d.data)}</b><span class="small muted num">${mins ? fmtH(mins) : "folga"}</span></div>${bl || `<p class="small muted" style="margin:0">Dia livre.</p>`}</div>`;
    }).join("");
    plan = `<div class="panel"><div class="panel-h"><h2>Seu cronograma</h2><span class="small muted">gerado em ${fmtD(cr.geradoEm)} · ${feitos} de ${tot} blocos concluídos</span></div>
      <div class="meter" style="margin-bottom:16px"><i style="width:${tot ? Math.round(100*feitos/tot) : 0}%"></i></div>
      <p class="small muted" style="margin-top:0">Marque o círculo ao terminar um bloco: abre o registro já preenchido, com espaço para anotar questões e acertos.</p>
      <div class="plan">${dias}</div></div>`;
  }
  return `<div class="stack"><div><p class="label">Planejamento</p><h1>Cronograma personalizado</h1></div>${plan}${form}</div>`;
}

function gerarCronograma(cfg){
  const me = S.me, st = computeStats(), det = localDetail();
  const mats = (me.materias||[]);
  const prio = mats.map(m => ({ m, p: (m.peso||3) * (1.5 - (st.materias[m.id]?.nivel || 0)/100), credit: 0 }));
  const sumP = prio.reduce((s,x) => s + x.p, 0);
  const queues = {}, ptr = {}, tipoNext = {};
  mats.forEach(m => {
    queues[m.id] = leaves(m).map(l => { const b = det.byLeaf[leafKey(l.mid,l.tid,l.sid)]; return { ...l, acc: b && b.q ? b.a/b.q : 1.1 }; })
      .sort((a,b) => a.status - b.status || a.acc - b.acc);
    ptr[m.id] = 0;
  });
  const last = { ...det.last };
  const dias = [], inicio = today(), n = cfg.semanas * 7;
  for (let i = 0; i < n; i++){
    const data = addDays(inicio, i);
    if (cfg.dataProva && data > cfg.dataProva) break;
    const cap = Math.round((cfg.horas[parseD(data).getDay()] || 0) * 60);
    let slots = Math.floor(cap / cfg.bloco);
    const blocos = [];
    if (slots > 0 && cfg.revisao){
      const revs = [];
      Object.entries(last).forEach(([k, d]) => { const dd = diffDays(d, data); if (dd === 1 || dd === 7 || dd === 30) revs.push(k); });
      revs.slice(0, slots >= 4 ? 2 : 1).forEach(k => {
        const [mid, tid, sid] = k.split("|");
        if (!findMat(mid)) return;
        blocos.push({ id: uid(), mid, tid: tid || null, sid: sid || null, tipo: "revisao", min: Math.min(cfg.bloco, 30), feito: false }); slots--;
      });
    }
    let prev = null;
    for (let s = 0; s < slots && prio.length; s++){
      prio.forEach(x => x.credit += x.p);
      const ord = [...prio].sort((a,b) => b.credit - a.credit);
      let pick = ord[0];
      if (pick.m.id === prev && ord.length > 1) pick = ord[1];
      pick.credit -= sumP; prev = pick.m.id;
      const q = queues[pick.m.id], leaf = q[ptr[pick.m.id] % q.length];
      let tipo = tipoNext[pick.m.id] || (leaf.status >= 2 ? "questoes" : "teoria");
      tipoNext[pick.m.id] = tipo === "teoria" ? "questoes" : "teoria";
      if (tipo === "questoes") ptr[pick.m.id]++;
      blocos.push({ id: uid(), mid: leaf.mid, tid: leaf.tid, sid: leaf.sid, tipo, min: cfg.bloco, feito: false });
      if (leaf.tid) last[leafKey(leaf.mid, leaf.tid, leaf.sid)] = data;
    }
    dias.push({ data, blocos });
  }
  return { cfg, geradoEm: today(), dias };
}

function viewRanking(){
  const ids = Object.keys(S.all), meConc = norm(S.me.concurso);
  const ui = S.ui;
  let grupo = ids.filter(id => S.all[id] && S.all[id].stats);
  if (ui.rkGroup === "concurso" && meConc) grupo = grupo.filter(id => norm(S.all[id].concurso) === meConc);
  const metric = ui.rkMetric, period = ui.rkPeriod;
  const rows = grupo.map(id => {
    const d = S.all[id], s = periodSum(d.stats, period), acc = s.q ? s.a/s.q : null;
    const fc = fcSum(d, period);
    const val = { pontos: Math.round(s.min/6 + s.q + s.a), horas: s.min, questoes: s.q, acerto: s.q >= 20 ? acc : null, nivel: d.stats.nivel || 0, flashcards: fc.n }[metric];
    return { id, s, val, fc };
  });
  const valid = rows.filter(r => r.val != null).sort((a,b) => b.val - a.val), semDados = rows.filter(r => r.val == null);
  const maxV = Math.max(1, ...valid.map(r => r.val || 0));
  const fmtV = v => metric === "horas" ? fmtH(v) : metric === "acerto" ? Math.round(v*100) + "%" : fmtN(v);
  const subt = r => metric === "flashcards" ? `${fmtN(r.fc.n)} cards revisados · ${pct(r.fc.ok, r.fc.n) ?? "—"}% lembrados` : metric === "acerto" ? `${fmtN(r.s.a)}/${fmtN(r.s.q)} questões` : metric === "nivel" ? `${esc(S.all[r.id].concurso || "sem concurso")}` : `${fmtH(r.s.min)} · ${fmtN(r.s.q)} questões · ${pct(r.s.a, r.s.q) ?? "—"}% acerto`;
  const board = valid.map((r, i) => `<div class="row ${r.id === S.uid ? "me" : ""}">
      <span class="pos">${i+1}º</span><img src="${avatarDe(r.id)}" alt="">
      <div class="who"><b>${esc(nomeDe(r.id))}${r.id === S.uid ? " (você)" : ""}</b><span class="small muted">${subt(r)}</span>
        <div class="bar" style="margin-top:6px"><i style="width:${Math.round(100*(r.val||0)/maxV)}%;background:var(--accent)"></i></div></div>
      <span class="val">${fmtV(r.val)}</span></div>`).join("");
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v,l]) => `<button type="button" class="${ui[key] === v ? "on" : ""}" data-act="rk" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>`;

  // Matriz por matéria
  const subjMap = {};
  grupo.forEach(id => Object.values(S.all[id].stats.materias || {}).forEach(m => { if (!m.key) return; (subjMap[m.key] = subjMap[m.key] || { nome: m.nome, cor: m.cor, cells: {} }).cells[id] = m; }));
  const subjs = Object.entries(subjMap).filter(([,v]) => Object.keys(v.cells).length >= 1).sort((a,b) => Object.keys(b[1].cells).length - Object.keys(a[1].cells).length).slice(0, 14);
  const cols = grupo.slice().sort((a,b) => (a === S.uid ? -1 : b === S.uid ? 1 : nomeDe(a).localeCompare(nomeDe(b)))).slice(0, 12);
  const matrixRows = subjs.map(([k, v]) => {
    const vals = cols.map(id => { const c = v.cells[id]; return c && c.q >= 5 ? Math.round(100*c.a/c.q) : null; });
    const nums = vals.filter(x => x != null), best = nums.length > 1 ? Math.max(...nums) : null, worst = nums.length > 1 ? Math.min(...nums) : null;
    return `<tr><td><span class="swatch" style="background:${v.cor||"var(--muted)"}"></span>${esc(v.nome)}</td>${vals.map(p => p == null ? `<td class="c muted">—</td>` :
      `<td class="c ${p === best && best !== worst ? "best" : ""} ${p === worst && best !== worst ? "worst" : ""}" style="background:color-mix(in srgb,var(--${accClass(p)}) 16%,transparent)">${p}%</td>`).join("")}</tr>`;
  }).join("");

  // Quem pode ajudar quem
  const ajuda = [], ajudo = [];
  Object.values(S.me.stats?.materias || {}).forEach(mm => {
    const sub = subjMap[mm.key]; if (!sub) return;
    const outros = Object.entries(sub.cells).filter(([id, c]) => id !== S.uid && c.q >= 10).map(([id, c]) => ({ id, p: c.a/c.q }));
    if (!outros.length) return;
    const meu = mm.q >= 10 ? mm.a/mm.q : null;
    const melhor = outros.sort((a,b) => b.p - a.p)[0];
    if (meu == null || melhor.p > meu + 0.05) ajuda.push({ mat: mm.nome, id: melhor.id, p: melhor.p, meu });
    else if (meu != null && meu > melhor.p) ajudo.push({ mat: mm.nome, meu, pior: outros[outros.length-1] });
  });
  const ajudaHtml = ajuda.slice(0,6).map(a => `<div class="card"><span class="label">${esc(a.mat)}</span><div><b>${esc(nomeDe(a.id))}</b> acerta ${Math.round(a.p*100)}%${a.meu != null ? `, você ${Math.round(a.meu*100)}%` : ""}.</div><span class="small muted">Peça dicas ou resolvam questões juntos.</span></div>`).join("");
  const ajudoHtml = ajudo.slice(0,6).map(a => `<div class="card"><span class="label">${esc(a.mat)}</span><div>Você lidera com <b>${Math.round(a.meu*100)}%</b>.</div><span class="small muted">${esc(nomeDe(a.pior.id))} está com ${Math.round(a.pior.p*100)}% e pode aproveitar sua ajuda.</span></div>`).join("");

  const metricNote = { flashcards: "Flashcards revisados no período: revisão do dia, modo embaralhado e baralhos do grupo.", pontos: "Pontos: 10 por hora estudada, 1 por questão feita e mais 1 por acerto.", horas: "Total de horas registradas no período.", questoes: "Questões resolvidas no período.", acerto: "Taxa de acerto; entra quem fez pelo menos 20 questões no período.", nivel: "Nível atual: 40% cobertura do edital + 60% acerto, ponderado pelo peso das matérias." }[metric];
  return `<div class="stack">
    <div><p class="label">Grupo de estudos</p><h1>Ranking</h1></div>
    <div class="panel">
      <div class="controls" style="margin-bottom:12px">
        ${seg("rkMetric", [["pontos","Geral"],["horas","Horas"],["questoes","Questões"],["acerto","Acerto"],["flashcards","Flashcards"],["nivel","Nível"]])}
        ${metric === "nivel" ? "" : seg("rkPeriod", [["7","7 dias"],["30","30 dias"],["total","Tudo"]])}
        ${seg("rkGroup", [["concurso","Meu concurso"],["todos","Todos"]])}
      </div>
      <p class="small muted" style="margin-top:0">${metricNote}${ui.rkGroup === "concurso" ? (meConc ? ` Mostrando quem estuda para “${esc(S.me.concurso)}”.` : " Informe seu concurso no Perfil para filtrar.") : ""}</p>
      ${board ? `<div class="board">${board}</div>` : `<div class="empty"><h3>Ainda sem dados no período</h3><p>Registre horas e questões para aparecer aqui.</p></div>`}
      ${semDados.length ? `<p class="small muted" style="margin-bottom:0">Sem dados suficientes nesta métrica: ${semDados.map(r => esc(nomeDe(r.id))).join(", ")}.</p>` : ""}
    </div>
    <div class="panel"><div class="panel-h"><h2>Comparativo por matéria</h2><span class="small muted">acerto com 5+ questões · contorno verde = melhor do grupo, vermelho = quem precisa de apoio</span></div>
      ${subjs.length && cols.length ? `<div class="tw"><table class="matrix"><thead><tr><th>Matéria</th>${cols.map(id => `<th class="p" title="${esc(nomeDe(id))}">${esc(nomeDe(id).split(" ")[0])}${id === S.uid ? " (você)" : ""}</th>`).join("")}</tr></thead><tbody>${matrixRows}</tbody></table></div>`
        : `<p class="muted">As matérias são comparadas pelo nome. Quando outros alunos do mesmo concurso registrarem questões, a comparação aparece aqui.</p>`}
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h2>Quem pode te ajudar</h2></div>${ajudaHtml ? `<div class="help">${ajudaHtml}</div>` : `<p class="muted">Aparece quando um colega tiver acerto maior que o seu numa matéria em comum (10+ questões).</p>`}</div>
      <div class="panel"><div class="panel-h"><h2>Onde você pode ajudar</h2></div>${ajudoHtml ? `<div class="help">${ajudoHtml}</div>` : `<p class="muted">Aparece quando você liderar o acerto de uma matéria em comum.</p>`}</div>
    </div>
  </div>`;
}
